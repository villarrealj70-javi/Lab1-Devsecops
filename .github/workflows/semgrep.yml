name: Semgrep SAST Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # Permiso necesario

jobs:
  semgrep:
    name: Scan with Semgrep
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Scan with Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/default,p/security-audit"
