name: Trivy SCA Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  trivy-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy (Vulnerabilities in dependencies)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'
          ignore-unfixed: false
          scanners: 'vuln'                    # Solo vulnerabilidades (no secretos)
          vuln-type: 'os,library'             # Escanea librerías npm
